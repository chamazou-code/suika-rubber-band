<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#777565" />
    <meta name="description" content="リアルな3Dスイカに、輪ゴムを1本。SAFEを狙って限界まで攻める、無料のワンタップゲーム。" />
    <meta property="og:title" content="スイカ輪ゴムチャレンジ 🍉" />
    <meta property="og:description" content="タイミングを合わせて輪ゴムを巻こう。スイカがはじけるまで、あと何本いける？ スマホ・PCですぐ遊べる無料3Dゲーム。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:image" content="https://chamazou-code.github.io/rubber-band/social.png" />
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:site_name" content="スイカ輪ゴムチャレンジ" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image:alt" content="木のテーブル上の3Dスイカと、輪ゴムを巻くタイミングメーター" />
    <title>スイカ輪ゴムチャレンジ 🍉 | 無料ワンタップゲーム</title>
  </head>
  <body>
    <main id="game" class="game" data-phase="ready" data-render="loading">
      <section class="stage" aria-label="木のテーブルの上の3Dスイカ">
        <canvas id="scene" aria-hidden="true"></canvas>
      </section>
      <header class="header">
        <h1>RUBBER <span>BAND</span><img src="/favicon.svg" width="32" height="32" alt="🍉" /></h1>
        <button id="sound" class="sound" type="button" aria-label="BGMと効果音をオフにする" title="BGM・効果音 ON" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="sound-waves" d="M17 8c2 2 2 6 0 8m3-11c4 4 4 10 0 14"/><path class="sound-slash" d="m17 9 5 6m0-6-5 6"/></svg>
        </button>
      </header>
      <div class="stage-intro"><p id="phase-label">ONE TAP. ONE BAND.</p><h2 id="stage-copy">あと1本、いける？</h2></div>
      <div class="hud">
        <div class="best"><span>BEST</span><strong id="hud-best">0</strong></div>
        <div class="score" id="score"><span id="band-count">0</span><span class="score-label">BANDS</span></div>
      </div>
      <div class="loading" role="status">SETTING THE TABLE<span>スイカを準備しています…</span></div>
      <div id="render-error" class="render-error" role="alert" hidden>
        <strong>3D表示を開始できませんでした</strong><p>ブラウザを更新して、もう一度お試しください。</p>
        <button id="reload" type="button">再読み込み</button>
      </div>
      <section class="controls" aria-label="タイミング操作">
        <div id="feedback" class="feedback" aria-hidden="true"><span id="feedback-symbol">✦</span><span id="feedback-text"></span></div>
        <div class="meter-panel">
          <div class="meter-visual" id="meter-visual">
            <canvas id="meter" aria-label="針がSAFEの中央に来たらタップ。中央はPERFECT、端はGOOD、外はMISS。"></canvas>
            <div id="meter-title">SAFEを狙ってタップ</div>
          </div>
          <div id="result" class="result" hidden>
            <p id="result-title">NICE SQUEEZE!</p>
            <div class="result-body">
              <div class="result-score"><span id="result-count">0</span><span>BANDS</span></div>
              <div class="result-stats"><span>PERFECT <b id="perfect-rate">0%</b></span><span>BEST <b id="best-count">0</b></span></div>
            </div>
          </div>
        </div>
        <div class="action-group">
          <p id="retry-message" class="retry-message" aria-hidden="true">次のスイカ、いってみよう。</p>
          <button id="action" class="action" type="button" disabled><span id="action-label">TAP TO START</span><span id="action-icon" aria-hidden="true">↗</span></button>
          <p class="hint"><span>TAP / CLICK / <kbd>SPACE</kbd></span><span id="sound-hint">SOUND ON</span></p>
        </div>
      </section>
      <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
      <noscript>このゲームを遊ぶには、ブラウザのJavaScriptを有効にしてください。</noscript>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
